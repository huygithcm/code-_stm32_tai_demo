name: Servo firmware build and test

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake gcc-arm-none-eabi

      - name: Test all five pin mappings
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            tests/test_servo_pinout.c -o /tmp/test_servo_pinout
          /tmp/test_servo_pinout

      - name: Test UART commands and angles
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
            src/servo_command.c tests/test_servo_commands.c \
            -o /tmp/test_servo_commands
          /tmp/test_servo_commands

      - name: Configure firmware
        run: cmake --preset stm32f103c8-debug

      - name: Build firmware
        run: cmake --build --preset stm32f103c8-debug
